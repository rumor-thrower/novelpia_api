openapi: 3.1.0

info:
  title: 노벨피아 비공식 API
  description: |
    노벨피아(novelpia.com) 웹소설 플랫폼의 비공식 API 명세입니다.

    공식 API 문서가 아니며, 공개된 웹 인터페이스의 역공학(소설 스크래퍼 PNWC·NWC·WNC 시리즈,
    유저스크립트 betternovelpia)을 통해 작성되었습니다.

    ## 인증
    로그인이 필요한 엔드포인트는 `LOGINKEY` 쿠키를 사용합니다.
    쿠키 값은 `<hex_a>_<hex_b>` 형태의 문자열입니다.

    CSRF 보호가 적용된 엔드포인트는 페이지 내 `#csrf` 요소의 값 또는
    `alarm_btn` JavaScript 함수에 포함된 `csrf` 값을 페이로드에 포함해야 합니다.

    ## 주의사항
    - `robots.txt`에 따라 `/proc/`, `/json/`, `/api/`, `/error/`, `/viewer/`, `/comic_viewer/`
      경로는 일반 검색 엔진 봇(Googlebot·Yeti·Daum 등 명시된 봇 제외)에 대해 Disallow입니다.
    - 이 API는 변경될 수 있으며 공식적으로 지원되지 않습니다.
    - 서버 부하 방지를 위해 요청 간 적절한 지연(1~3초)을 권장합니다.
  version: "0.1.0"
  contact:
    name: 노벨피아
    url: https://novelpia.com

servers:
  - url: https://novelpia.com
    description: 노벨피아 한국 서버

tags:
  - name: 페이지 (HTML)
    description: 브라우저에서 직접 렌더링되는 HTML 페이지 엔드포인트
  - name: 소설
    description: 소설 정보·목록 관련 `/proc/` 엔드포인트
  - name: 회차
    description: 회차 목록·본문 관련 `/proc/` 엔드포인트
  - name: 사용자
    description: 회원 정보·행동(선호·알람·차단) 관련 `/proc/` 엔드포인트
  - name: 소설 목록
    description: 소설 목록·랭킹·검색 HTML 페이지 (`/freestory`, `/plus`, `/top100`, `/search`)
  - name: 사이트 공통
    description: 로그인·회원가입·공지·상점·이벤트 등 공통 HTML 페이지
  - name: 아레나
    description: 커뮤니티 게시판(아레나) HTML 페이지 (`/arena`)

# ─────────────────────────────────────────────────────────────
# 컴포넌트
# ─────────────────────────────────────────────────────────────
components:

  # ── 보안 스킴 ─────────────────────────────────────────────
  securitySchemes:
    loginKeyCookie:
      type: apiKey
      in: cookie
      name: LOGINKEY
      description: |
        로그인 세션 키. 형식: `<32자리 hex>_<32자리 hex>`
        예시: `1893a24e1af23c4aa4a792a51ee4159c_0dc0e2e76df7a0d6b77358ed762968ab`

    csrfToken:
      type: apiKey
      in: cookie
      name: csrf
      description: |
        CSRF 방어 토큰. 페이지 DOM의 `#csrf` 요소 value 또는
        `alarm_btn` JS 함수 내 `"csrf": "..."` 값에서 추출합니다.

  # ── 스키마 ──────────────────────────────────────────────
  schemas:

    UserEmoticonItem:
      type: object
      description: |
        `/proc/emoticon_proc?mode=get_user_emoticon` 응답의 그룹 내 보유 이모티콘 항목.
        (그룹 목록 조회 `get_user_emoticon_group`의 항목과는 필드 구성이 다릅니다.)
      properties:
        idx:
          type: integer
          description: 이모티콘 항목 고유 번호
          example: 12068
        is_use:
          type: integer
          description: 사용 가능 여부 (1=사용 가능)
          example: 1
        is_fav:
          type: integer
          description: 즐겨찾기 여부 (1=즐겨찾기)
          example: 0
        state:
          type: integer
          description: 이모티콘 상태 (그룹 목록의 state와 동일 의미)
          example: 8
        emoticon_url:
          type: string
          description: 이모티콘 이미지 URL (프로토콜 상대 경로)
          example: "//images.novelpia.com/img/emoticon/174/12068.png"

    BaseResponse:
      type: object
      description: 모든 `/proc/` JSON 응답의 공통 필드
      properties:
        status:
          description: HTTP 상태 코드 (문자열 또는 정수)
          oneOf:
            - type: string
              example: "200"
            - type: integer
              example: 200
        errmsg:
          type: string
          description: 오류 메시지. 정상이면 빈 문자열.
          example: ""
      required:
        - status
        - errmsg

    Novel:
      type: object
      description: 노벨피아 소설(작품) 정보
      properties:
        novel_no:
          type: [integer, string]
          minimum: 1
          description: 소설 고유 번호(ID)
          example: 372669
        novel_name:
          type: string
          description: 소설 제목
          example: "다크 판타지에서도 쌀은 먹고 살아야지?"
        novel_story:
          type: [string, "null"]
          description: 줄거리(작품 소개). 목록 응답에서는 제외될 수 있음
          example: "마녀가 지배하는 도시에서..."
        writer_nick:
          type: [string, "null"]
          description: 작가 필명
          example: "미츄리"
        mem_nick:
          type: [string, "null"]
          description: 작가 필명 (필드명 이슈로 writer_nick과 중복 가능)
          example: "미츄리"
        writer_original:
          type: [string, "null"]
          description: 원작자 (번역작·2차 창작의 경우)
          example: ""
        mem_no:
          type: integer
          minimum: 1
          description: 작가 회원 번호
          example: 28450
        main_genre:
          type: integer
          minimum: 0
          maximum: 14
          description: |
            기본 장르 번호
            - 0: 하렘
            - 1: 판타지
            - 2: 무협
            - 3: 현대
            - 4: (불명)
            - 5: 고수위
            - 6: 로맨스
            - 7: 대체역사
            - 8: 스포츠
            - 9: SF
            - 10: 기타
            - 11: 패러디
            - 12: 현대 판타지
            - 13: 라이트노벨
            - 14: 공포
          example: 1
        novel_genre:
          oneOf:
            - type: string
              description: 세부 장르 목록 (JSON 배열을 직렬화한 문자열)
              example: '["판타지","라이트노벨","일상","로맨스"]'
            - type: array
              description: 세부 장르 목록 (배열 형식, 일부 엔드포인트에서 사용)
              items:
                type: string
              example: ["판타지", "중세", "하렘"]
        novel_type:
          type: integer
          enum: [1, 2]
          description: |
            소설 유형
            - 1: PLUS (유료)
            - 2: 자유 연재 (무료)
          example: 1
        novel_age:
          type: integer
          minimum: 0
          description: |
            최소 열람 연령
            - 0: 전체 이용가
            - 15: 15세 이상
            - 19: 성인(19세 이상)
          example: 0
        novel_live:
          type: integer
          enum: [0, 1, 2]
          description: |
            연재 상태 코드 (`is_complete`, `is_del`과 조합하여 최종 상태 결정)
            - 0: 연재 중
            - 1: 연재 지연
            - 2: 연재 중단
          example: 0
        is_del:
          type: integer
          enum: [0, 1]
          description: 삭제 여부 (1이면 삭제됨)
          example: 0
        is_complete:
          type: integer
          enum: [0, 1]
          description: 완결 여부 (1이면 완결)
          example: 0
        is_monopoly:
          type: integer
          enum: [0, 1]
          description: 플랫폼 독점 여부
          example: 1
        is_translation:
          type: integer
          enum: [0, 1]
          description: 번역본 여부
          example: 0
        flag_translate:
          type: integer
          enum: [0, 1]
          description: 번역본 여부 (한국 서버 필드명, `is_translation`과 동일)
          example: 0
        is_secondary_creation:
          type: integer
          enum: [0, 1]
          description: 2차 창작 여부
          example: 0
        is_donation_refusal:
          type: integer
          enum: [0, 1]
          description: 후원 거부 여부
          example: 0
        is_contest:
          type: integer
          minimum: 0
          description: |
            수상한 공모전 ID (0이면 해당 없음)
            - 2: 2021 우주최강 공모전
            - 4: 2022 노벨피아 천지창조 공모전
            - 5: 2022 마스터피스 성인웹소설 공모전
            - 7: 2022 노벨피아 제2회 우주최강공모전
            - 12: 2023 노벨피아 제3회 우주최강 공모전
            - 17: 2024 노벨피아 제4회 우주최강 공모전
          example: 0
        is_osmu:
          type: [string, "null"]
          description: OSMU(One Source Multi Use) 플랫폼 식별자
          example: "toptoon"
        isbn:
          type: [string, "null"]
          description: 국제 표준 도서 번호 (ISBN-13)
          example: "9791140400256"
        local_code:
          type: [string, "null"]
          description: 언어/지역 코드
          example: "KR"
        reg_date:
          type: [string, "null"]
          format: date-time
          description: 작품 등록 일시
          example: "2021-01-07T12:00:00"
        complete_date:
          type: [string, "null"]
          format: date-time
          description: 연재 종료(완결) 일시
          example: null
        last_write_date:
          type: [string, "null"]
          format: date-time
          description: 최근(또는 예정) 연재 일시
          example: "2024-09-13T18:00:00"
        del_date:
          type: [string, "null"]
          format: date-time
          description: 작품 삭제 일시
          example: null
        status_date:
          type: [string, "null"]
          format: date-time
          description: 서버 측 정보 갱신 일시
          example: "2024-09-13T18:05:00"
        update_dt:
          type: [string, "null"]
          format: date-time
          description: 소설 갱신 일시
          example: "2024-09-13T18:00:00"
        count_view:
          type: integer
          minimum: 0
          description: 조회 수
          example: 1500000
        count_good:
          type: integer
          minimum: 0
          description: 추천 수
          example: 3200
        count_pick:
          type: [integer, "null"]
          minimum: 0
          description: 인생픽 순위/수
          example: 242
        count_like:
          type: integer
          minimum: 0
          description: 선호 수
          example: 1895
        count_alarm:
          type: integer
          minimum: 0
          description: 알람 설정 수
          example: 1896
        count_book:
          type: integer
          minimum: 0
          description: 총 회차 수
          example: 150
        novel_thumb:
          type: [string, "null"]
          description: 소설 썸네일 이미지 URL (상대 경로)
          example: "//images.novelpia.com/imagebox/cover/11576a6b7d10e5a37598da89dfa7b3b6_369320_ori.wimg"
        rank_view:
          type: [string, integer, "null"]
          description: 랭킹 기준 조회수 (인기 목록에서만 나타남)
          example: "97810"
        rank_exp:
          type: [string, "null"]
          description: 랭킹 상승/하락 정보 (일반적으로 null)
          example: null

    EpisodeTextLine:
      type: object
      description: 회차 본문의 한 줄
      properties:
        text:
          type: string
          description: |
            본문 텍스트 한 줄.
            빈 줄은 `"&nbsp;"` 값으로 표현됩니다.
          example: "마녀가 도시를 지배하기 시작했을 때,"

    EpisodeViewCount:
      type: object
      description: 특정 회차의 조회수 항목
      properties:
        episode_no:
          type: integer
          description: 회차 번호 (`ep_code`와 동일)
          example: 12606
        count_view:
          type: string
          description: 조회수 (쉼표 구분 숫자 문자열)
          example: "1,057"

    MemberView:
      type: object
      description: 회원 공개 프로필 통계 (`get_member_view` 모드 응답 내 `result`)
      properties:
        mem_no:
          type: integer
          minimum: 1
          description: 회원 고유 번호
          example: 300142
        view_comment:
          type: ["integer", "null"]
          description: 댓글 공개 여부 (null 또는 정수, 의미 불명)
          example: null
        view_like_novel:
          type: integer
          description: 선호작 공개 여부 (0=비공개, 1=공개 추정)
          example: 0
        view_like_hash:
          type: integer
          description: 선호 해시태그 공개 여부 (0=비공개, 1=공개 추정)
          example: 0
        view_sponsor:
          type: integer
          description: 후원 공개 여부 (0=비공개, 1=공개 추정)
          example: 0
        episode_cnt:
          type: integer
          minimum: 0
          description: 회원이 읽은 전체 회차 수
          example: 76318
        comment_cnt:
          type: integer
          minimum: 0
          description: 회원의 댓글 수
          example: 0

    MemberBlockChk:
      type: object
      description: 특정 회원에 대한 차단 여부 확인 (`get_user_block_chk` 모드 응답 내 `result`)
      properties:
        idx:
          type: integer
          description: 차단 레코드 고유 번호
          example: 883261
        mem_no:
          type: integer
          minimum: 1
          description: 차단을 수행한 회원 번호 (본인)
          example: 2529720
        target_mem_no:
          type: integer
          minimum: 1
          description: 차단된 대상 회원 번호
          example: 4169856
        regdate:
          type: string
          format: date-time
          description: 차단 등록 일시
          example: "2026-06-28 02:08:52"

    NovelReviewItem:
      type: object
      description: 소설 리뷰(작품평) 한 건
      properties:
        board_no:
          type: integer
          description: 게시판 번호 (작품평 게시판은 5)
          example: 5
        content_no:
          type: integer
          description: 게시물 고유 번호
          example: 1660545
        content_cate:
          type: integer
          description: 게시물 카테고리 (작품 리뷰는 32)
          example: 32
        content_subject:
          type: string
          description: 리뷰 제목
          example: "세상에서 가장 성능좋은 세탁기"
        content_link:
          type: string
          format: uri
          description: 리뷰가 달린 소설 URL
          example: "https://novelpia.com/novel/6269"
        content_image:
          type: string
          description: 첨부 이미지 (없으면 빈 문자열)
          example: ""
        content_memo_linkno:
          type: integer
          description: 리뷰 게시물 직접 링크 번호
          example: 104678092
        content_adult:
          type: integer
          description: 성인 콘텐츠 여부 (0=일반, 1=성인)
          example: 0
        mem_nick:
          type: string
          description: 작성자 닉네임 HTML (뱃지 img 태그 포함)
          example: "<b style='cursor:pointer;font-weight:500;' onclick=\"location='/user/130334';\">LaVan</b>"
        mem_no:
          type: integer
          description: 작성자 회원 번호
          example: 130334
        count_view:
          type: integer
          description: 리뷰 조회수
          example: 34980
        count_comment:
          type: integer
          description: 댓글 수
          example: 21
        count_good:
          type: integer
          description: 추천 수
          example: 132
        content_regdate:
          type: string
          format: date-time
          description: 리뷰 작성 일시
          example: "2022-09-10 06:22:54"
        novel_name:
          type: string
          description: 소설 제목
          example: "용사 파티 때려치웁니다"
        novel_no:
          type: integer
          description: 소설 번호
          example: 6269
        novel_img:
          type: string
          description: 소설 커버 이미지 경로 (상대 경로)
          example: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
        novel_img_all:
          type: string
          description: 소설 커버 이미지 전체 경로
          example: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
        novel_thumb:
          type: string
          description: 소설 썸네일 URL
          example: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
        novel_thumb_all:
          type: string
          description: 소설 썸네일 전체 경로
          example: "/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.file"
        user_img:
          type: string
          description: 작성자 프로필 이미지 HTML img 태그 (없으면 빈 문자열)
          example: "<img src=\"https://phinf.pstatic.net/...\" class=\"rounded-circle s_inv\">"
        cover_url:
          type: string
          description: 소설 커버 URL (novel_thumb와 동일)
          example: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"

    PipeDelimitedResponse:
      type: string
      description: |
        파이프(`|`)로 구분된 텍스트 응답.

        형식: `{status}|{count}||{extra}`

        - `status`: `on` (설정됨) · `off` (해제됨) · `login` (로그인 필요)
        - `count`: 설정/해제 후 현재 수치 (정수)
        - `extra`: 예비 필드 (보통 비어 있거나 `0`)
      examples:
        - "on|1896||0"
        - "off|1895||"
        - "login|0||"

  # ── 재사용 요청 본문 ────────────────────────────────────────
  requestBodies:

    GetNewHotListBody:
      description: 새로운 인기 목록 조회 요청 본문
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [mode, period, target]
            properties:
              mode:
                type: string
                enum: [getNewHotList]
                example: "getNewHotList"
              period:
                type: string
                enum: [weekly, realtime]
                description: |
                  집계 기간
                  - `weekly`: 주간
                  - `realtime`: 실시간
                example: "weekly"
              target:
                type: string
                enum: [complete, view, like]
                description: |
                  정렬 기준 / 대상 필터
                  - `complete`: 완결작
                  - `view`: 조회순
                  - `like`: 추천순
                example: "complete"
              genre:
                type: [string, "null"]
                description: 한글 장르명 (예 - `판타지`, `무협`, `현대`). 공백은 "전체" 의미
                example: "판타지"
              main_genre:
                type: [string, "null"]
                description: 장르 ID (0~14). `genre` 파라미터 대체 형식. 일반적으로 `genre` 사용 권장
                example: ""
              listpage:
                type: string
                description: 페이지 번호 (0부터 시작)
                default: "0"
                example: "0"

    GetEpisodeCountViewBody:
      description: 회차 조회수 일괄 조회 요청 본문
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [cmd, novel_no]
            properties:
              cmd:
                type: string
                enum: [get_episode_count_view, get_episode_cnt_view]
                description: |
                  처리 명령
                  - `get_episode_count_view`: 신버전
                  - `get_episode_cnt_view`: 구버전
                example: "get_episode_count_view"
              novel_no:
                type: string
                description: 소설 번호
                example: "23"
            additionalProperties:
              type: string
              description: |
                `episode_arr[N]` 형식의 회차 배열 항목.

                **신버전** (`cmd=get_episode_count_view`):
                  키 `episode_arr[N]`, 값 `"episode_count_view novel_count_view_{ep_code}"`

                **구버전** (`cmd=get_episode_cnt_view`):
                  키 `episode_arr[]`, 값 `"episode_cnt_view novel_cnt_view_{ep_code}"`

                한 번에 최대 20개(페이지당 회차 수) 전송 가능합니다.
          examples:
            신버전:
              summary: 신버전 파라미터
              value:
                cmd: "get_episode_count_view"
                novel_no: "23"
            구버전:
              summary: 구버전 파라미터
              value:
                cmd: "get_episode_cnt_view"
                novel_no: "23"

    GetMemberViewBody:
      description: 회원 공개 프로필 통계 조회 요청 본문
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [mode, mem_no]
            properties:
              mode:
                type: string
                enum: [get_member_view]
                example: "get_member_view"
              mem_no:
                type: string
                description: 조회할 회원 번호
                example: "300142"

    GetFavoriteNovelBody:
      description: 회원 선호작 목록 조회 요청 본문
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [mode, mem_no]
            properties:
              mode:
                type: string
                enum: [get_member_favorite_novel]
                example: "get_member_favorite_novel"
              mem_no:
                type: string
                description: 조회할 회원 번호
                example: "12345"
              "paging[rowCount]":
                type: string
                description: 한 번에 가져올 최대 항목 수
                default: "1000"
                example: "1000"
              "paging[curPage]":
                type: string
                description: 현재 페이지 (1부터 시작)
                default: "1"
                example: "1"
              "paging[order]":
                type: string
                description: 정렬 기준 필드
                example: "date"
              "paging[sort][date]":
                type: string
                enum: ["0", "1"]
                description: |
                  날짜 정렬 방향
                  - `"0"`: 오름차순
                  - `"1"`: 내림차순
                example: "1"

# ─────────────────────────────────────────────────────────────
# 경로 (Paths)
# ─────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════
  # HTML 페이지
  # ══════════════════════════════════════════════

  /novel/{novel_code}:
    get:
      tags: [페이지 (HTML)]
      summary: 소설 메인 페이지
      description: |
        소설의 제목·작가명·줄거리·장르·통계 등이 포함된 HTML 페이지를 반환합니다.

        | 상황 | 모달 메시지 |
        |------|------------|
        | 삭제된 소설 | `"삭제된 소설 입니다."` |
        | 비공개(연습) 작품 | `"잘못된 접근입니다."` |
        | 잘못된 번호 | `"잘못된 소설 번호 입니다."` |

        위 오류 상황에서도 HTTP 200이 반환됩니다.
      operationId: getNovelPage
      parameters:
        - name: novel_code
          in: path
          required: true
          description: 소설 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 23
      responses:
        "200":
          description: 소설 페이지 HTML
          content:
            text/html:
              schema:
                type: string

  /viewer/{ep_code}:
    get:
      tags: [페이지 (HTML)]
      summary: 회차 뷰어 페이지 (스크롤 방식)
      description: |
        회차 본문을 스크롤 방식으로 표시하는 HTML 페이지입니다.
        비로그인 상태에서 PLUS 회차 접근 시 구독 안내 팝업이 나타납니다.
        `robots.txt`에서 `/viewer/` 전체가 봇에 대해 Disallow 처리되어 있습니다.
      operationId: getViewerPage
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: 회차 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 3790123
      responses:
        "200":
          description: 뷰어 HTML 페이지
          content:
            text/html:
              schema:
                type: string

  /comic_viewer/{ep_code}:
    get:
      tags: [페이지 (HTML)]
      summary: 회차 뷰어 페이지 (페이지/만화 방식)
      description: |
        회차 본문을 페이지 넘김(만화) 방식으로 표시하는 HTML 페이지입니다.
        `robots.txt`에서 `/comic_viewer/` 전체가 봇에 대해 Disallow 처리되어 있습니다.
      operationId: getComicViewerPage
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: 회차 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 3790123
      responses:
        "200":
          description: 만화 방식 뷰어 HTML 페이지
          content:
            text/html:
              schema:
                type: string

  /user/{mem_no}:
    get:
      tags: [페이지 (HTML)]
      summary: 회원 프로필 페이지
      description: 특정 회원의 공개 프로필 페이지를 반환합니다.
      operationId: getUserProfilePage
      parameters:
        - name: mem_no
          in: path
          required: true
          description: 회원 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 28450
      responses:
        "200":
          description: 회원 프로필 HTML 페이지
          content:
            text/html:
              schema:
                type: string

  /mybook:
    get:
      tags: [페이지 (HTML)]
      summary: 내 서재 페이지
      description: |
        로그인한 회원의 선호작(좋아요) 목록이 포함된 내 서재 페이지입니다.
        로그인 쿠키 없이 접근하면 로그인 페이지로 리다이렉트됩니다.
      operationId: getMyBookPage
      security:
        - loginKeyCookie: []
      responses:
        "200":
          description: 내 서재 HTML 페이지
          content:
            text/html:
              schema:
                type: string
        "302":
          description: 비로그인 → 로그인 페이지로 리다이렉트

  /notice/{category}/view_{post_code}/:
    get:
      tags: [페이지 (HTML)]
      summary: 공지사항 페이지
      operationId: getNoticePage
      parameters:
        - name: category
          in: path
          required: true
          description: "카테고리 슬러그 (예: `20`, `all`)"
          schema:
            type: string
          example: "20"
        - name: post_code
          in: path
          required: true
          description: 게시글 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 1392
      responses:
        "200":
          description: 공지사항 HTML 페이지
          content:
            text/html:
              schema:
                type: string

  /faq/{category}/view_{post_code}/:
    get:
      tags: [페이지 (HTML)]
      summary: FAQ 페이지
      operationId: getFaqPage
      parameters:
        - name: category
          in: path
          required: true
          description: "카테고리 슬러그 (예: `all`)"
          schema:
            type: string
          example: "all"
        - name: post_code
          in: path
          required: true
          description: FAQ 게시글 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 383218
      responses:
        "200":
          description: FAQ HTML 페이지
          content:
            text/html:
              schema:
                type: string

  # ══════════════════════════════════════════════
  # 소설 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/main:
    post:
      tags: [소설]
      summary: 메인 페이지 데이터 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 다목적 메인 페이지 처리 엔드포인트입니다.

        | mode | 설명 |
        |------|------|
        | `getNewHotList` | 새로운 인기 목록 조회 |

        응답은 인기 소설 목록을 반환합니다 (`result` 필드에 배열 형식).
      operationId: procMain
      requestBody:
        $ref: "#/components/requestBodies/GetNewHotListBody"
      responses:
        "200":
          description: 인기 목록 JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      result:
                        type: array
                        description: 인기 소설 목록
                        items:
                          $ref: "#/components/schemas/Novel"
              example:
                status: "200"
                errmsg: ""
                result:
                  - novel_genre:
                      - "판타지"
                      - "중세"
                      - "하렘"
                      - "먼치킨"
                    novel_thumb: "//images.novelpia.com/imagebox/cover/11576a6b7d10e5a37598da89dfa7b3b6_369320_ori.wimg"
                    novel_age: "0"
                    novel_name: "다크 판타지에서도 쌀은 먹고 살아야지?"
                    novel_no: "372669"
                    mem_nick: "미츄리"
                    rank_view: "97810"
                    rank_exp: null
                    main_genre: "1"

  /proc/novel:
    get:
      tags: [소설]
      summary: 소설 리뷰 목록 조회
      description: |
        특정 소설의 작품평(리뷰) 목록을 반환합니다.

        `cmd=get_novel_review_list` 와 `target_novel_no` 쿼리 파라미터가 필수입니다.
        `_` 파라미터는 캐시 무효화용 타임스탬프이며 생략 가능합니다.
      operationId: getNovelReviewList
      parameters:
        - name: cmd
          in: query
          required: true
          schema:
            type: string
            enum: [get_novel_review_list]
          example: "get_novel_review_list"
        - name: target_novel_no
          in: query
          required: true
          schema:
            type: integer
          description: 조회할 소설 번호
          example: 6269
        - name: _
          in: query
          required: false
          schema:
            type: integer
          description: 캐시 무효화용 타임스탬프 (밀리초 Unix 타임스탬프)
          example: 1782829890640
      responses:
        "200":
          description: 소설 리뷰 목록 JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NovelReviewItem"
              example:
                status: 200
                code: ""
                errmsg: ""
                data:
                  - board_no: 5
                    content_no: 1660545
                    content_cate: 32
                    content_subject: "세상에서 가장 성능좋은 세탁기"
                    content_link: "https://novelpia.com/novel/6269"
                    content_image: ""
                    content_memo_linkno: 104678092
                    content_adult: 0
                    mem_nick: "<b style='cursor:pointer;font-weight:500;' onclick=\"location='/user/130334';\">LaVan</b>"
                    mem_no: 130334
                    count_view: 34980
                    count_comment: 21
                    count_good: 132
                    content_regdate: "2022-09-10 06:22:54"
                    novel_name: "용사 파티 때려치웁니다"
                    novel_no: 6269
                    novel_img: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
                    novel_img_all: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
                    novel_thumb: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
                    novel_thumb_all: "/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.file"
                    user_img: ""
                    cover_url: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
    post:
      tags: [소설]
      summary: 소설 관련 처리 (다목적)
      description: |
        `cmd` 파라미터로 동작을 구분하는 다목적 소설 처리 엔드포인트입니다.

        | cmd | 설명 |
        |-----|------|
        | `get_episode_count_view` | 회차 조회수 일괄 조회 (신버전) |
        | `get_episode_cnt_view` | 회차 조회수 일괄 조회 (구버전) |

        두 cmd 값은 동일한 기능이며 파라미터 명만 다릅니다.
      operationId: procNovel
      requestBody:
        $ref: "#/components/requestBodies/GetEpisodeCountViewBody"
      responses:
        "200":
          description: 회차 조회수 JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: "#/components/schemas/EpisodeViewCount"
              example:
                status: 200
                errmsg: ""
                list:
                  - episode_no: 7146
                    count_view: "1,057"
                  - episode_no: 7147
                    count_view: "842"

  /proc/novel_alarm:
    post:
      tags: [소설]
      summary: 소설 알람 설정/해제 토글
      description: |
        특정 소설의 새 회차 알람을 설정하거나 해제합니다.
        이미 설정된 상태이면 해제, 해제된 상태이면 설정됩니다.

        비로그인 시 `login|0||` 응답이 반환됩니다.
      operationId: toggleNovelAlarm
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1896||0"

  /proc/novel_like:
    post:
      tags: [소설]
      summary: 소설 선호작 설정/해제 토글
      description: |
        특정 소설을 선호작으로 등록하거나 해제합니다.
        CSRF 토큰이 필요합니다 (소설 페이지의 `alarm_btn` JS 함수 내 `"csrf"` 값).

        비로그인 시 `login|0||` 응답이 반환됩니다.

        **주의**: 실 서버 테스트 결과, 성공 시 응답 본문이 빈 문자열(`Content-Length: 0`)로
        반환되는 경우가 관찰됩니다. 파이프 응답 형식과 다를 수 있으며, HTTP 200 여부로 성공을 판단하세요.
      operationId: toggleNovelLike
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no, csrf_token]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
                csrf_token:
                  type: string
                  description: CSRF 방어 토큰
                  example: "abc123def456"
      responses:
        "200":
          description: |
            성공 시 빈 본문(`Content-Length: 0`) 또는 파이프 구분 응답.
            비로그인 시 `login|0||` 반환.
          content:
            text/plain:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PipeDelimitedResponse"
                  - type: string
                    maxLength: 0
                    description: 성공 시 빈 문자열
              example: ""

  /proc/board_option:
    post:
      tags: [소설]
      summary: 게시판 옵션 처리 (회차 추천/비추천)
      description: |
        `option` 파라미터에 따라 게시판 옵션을 처리합니다.

        | option | 설명 |
        |--------|------|
        | `vote_novel` | 회차 추천/비추천 토글 |

        CSRF 토큰이 필요합니다.
        응답이 `on`으로 시작하면 추천 등록, `off`로 시작하면 추천 해제입니다.
      operationId: procBoardOption
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [option, value, csrf]
              properties:
                option:
                  type: string
                  enum: [vote_novel]
                  description: 처리 옵션 종류
                  example: "vote_novel"
                value:
                  type: string
                  description: 대상 회차 번호 (`ep_code`)
                  example: "3790123"
                csrf:
                  type: string
                  description: CSRF 방어 토큰
                  example: "abc123def456"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1||"

  # ══════════════════════════════════════════════
  # 회차 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/episode_list:
    post:
      tags: [회차]
      summary: 회차 목록 조회
      description: |
        소설의 회차 목록 HTML 조각을 반환합니다.
        한 페이지당 20개 회차가 포함됩니다.

        - `sort`: 정렬 방향 (`DOWN` = 첫화부터, `UP` = 최신화부터)
        - `page`: 0부터 시작 (1페이지 → `0`, 2페이지 → `1`, ...)
        - 로그인 쿠키 포함 시 PLUS 회차 링크도 포함됩니다.

        응답은 전체 HTML이 아닌 `<table>` 조각입니다.
        소설 번호는 회차 목록 내 `.page-link` 태그의 `onclick` 속성에서 추출합니다.
      operationId: getEpisodeList
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
                sort:
                  type: string
                  enum: [DOWN, UP]
                  default: DOWN
                  description: |
                    정렬 방향
                    - `DOWN`: 첫화부터 (오름차순)
                    - `UP`: 최신화부터 (내림차순)
                  example: "DOWN"
                page:
                  type: integer
                  minimum: 0
                  default: 0
                  description: 페이지 번호 (0부터 시작)
                  example: 0
      responses:
        "200":
          description: 회차 목록 HTML 조각
          content:
            text/html:
              schema:
                type: string
              example: |
                <table class="s_inv">
                  <tbody>
                    <tr class="ep_style5" data-episode-no="7146">
                      <td class="font12" onclick="$('.loads').show();location='/viewer/7146';">
                        <b>
                          <span class="b_free s_inv">무료</span>
                          <i class="icon ion-bookmark" id="bookmark_7146" style="display:none;"></i>
                          001. 능력 각성
                        </b>
                      </td>
                    </tr>
                  </tbody>
                </table>

  /proc/novel_comment/{novel_no}:
    get:
      tags: [회차]
      summary: 소설 댓글 목록 조회 (HTML)
      description: |
        특정 소설의 댓글 목록을 페이지 단위로 조회합니다.

        페이지네이션은 `page` 쿼리 파라미터로 제어됩니다 (1부터 시작).
        한 페이지당 댓글 수는 서버 기본값을 따릅니다.

        **응답 형식**: HTML 조각 (JSON이 아님)
        - 헤더: `.comment_header` 요소 (정렬 옵션 포함)
        - 댓글 항목: `.row._comment_flag` (각 댓글은 `id="comment_{comment_id}"`)
        - 댓글 작성자: `<b onclick="location='/user/{mem_no}';">` 형식
        - 댓글 내용: `#comment_text_{comment_id}` div
        - 추천/비추: `#comment_vote_{comment_id}`, `#comment_bad_vote_{comment_id}`
        - 신고: `#comment_report_{comment_id}`

        비로그인 상태에서도 공개 댓글 조회 가능합니다.
      operationId: getNovelComments
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: novel_no
          in: path
          required: true
          description: 소설 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 35
        - name: page
