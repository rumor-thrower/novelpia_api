# ─────────────────────────────────────────────────────────────
# 확장 정보 (비고)
# ─────────────────────────────────────────────────────────────
x-novelpia-cookies:
  description: |
    노벨피아에서 사용되는 주요 쿠키

    | 이름 | 예시 값 | 설명 |
    |------|---------|------|
    | `LOGINKEY` | `1893a24e1af23c4aa4a792a51ee4159c_0dc0e2e76df7a0d6b77358ed762968ab` | 로그인 세션 키 |
    | `USERKEY` | `cf9049ba77ba25f9f2ab60885ef9f087` | 사용자 식별자 |
    | `NPD{DD}{MM}1` | `NPD15081=meta` | 당일 일반 쿠키 (DD=일, MM=월) |
    | `NPK{MM}{DD}` | `NPK0811=OObWV0YQ..` | 당일 보조 쿠키 |
    | `SITE_LANG` | `ko-KR` | 사이트 언어 설정 |
    | `REF_DATA` | `/novel/1` | 마지막 방문 경로 |
    | `PRIVATE_MODE` | `error` | 개인 정보 처리 관련 |

x-novelpia-robots:
  description: |
    `robots.txt` 요약

    - `User-agent: *` → `Disallow: /` (일반 봇 전체 차단)
    - 다음 봇은 허용 (단 아래 경로 제외):
      Googlebot / Yeti / Daum / Daumoa / Ads-Naver / facebookexternalhit
      - `Disallow: /proc/`
      - `Disallow: /json/`
      - `Disallow: /api/`
      - `Disallow: /error/`
      - `Disallow: /viewer/`
      - `Disallow: /comic_viewer/`

x-novelpia-html-selectors:
  description: |
    HTML 파싱에 사용되는 주요 CSS 선택자

    **회차 목록 (episode_list 응답)**

    | 선택자 | 대상 |
    |--------|------|
    | `table.s_inv` | 회차 목록 테이블 |
    | `tr.ep_style5` | 회차 행. `data-episode-no` 속성에 ep_code 포함 |
    | `span.s_inv` | 회차 유형 태그 (무료·성인) |
    | `.b_free` | 무료 회차 클래스 |
    | `.b_19` | 성인(19금) 회차 클래스 |
    | `span.episode_count_view.novel_count_view_{ep_code}` | 회차별 조회수 위젯 |
    | `i.ion-document-text` | 글자 수 아이콘 |
    | `i.ion-chatbox-working` | 댓글 수 아이콘 |
    | `i.ion-thumbsup` | 추천 수 아이콘 |
    | `.page-link` | 페이지 링크 (소설 번호 추출에 활용) |

    **뷰어 페이지**

    | 선택자 | 대상 |
    |--------|------|
    | `#novel_box` | 뷰어 본문 스크롤 컨테이너 |
    | `#episode_list` | 회차 목록 컨테이너 |
    | `#comment_load` | 댓글 목록 컨테이너 |
    | `#csrf` | CSRF 토큰 input 요소 |
    | `.menu-top-tag` | 화수 표기 태그 (예: `EP.1`) |
    | `#header_bar` | 상단 헤더 바 |
    | `#footer_bar` | 하단 푸터 바 |
    | `#novel_drawing` | 소설 일러스트 영역 |
    | `#m-sidemenu .sidemenu-support` | 사이드 메뉴 (지원) |

x-novelpia-episode-num-format:
  description: |
    회차 화수(num) 표기 형식

    | 표기 | 의미 |
    |------|------|
    | `EP.0` | 프롤로그 |
    | `EP.N` | N화 (1부터 시작) |
    | `BONUS` | 보너스화 |

    프롤로그는 2022년 5월 16일 이후 신규 등록 불가.
    에필로그 기능은 2022년 5월 16일부로 삭제.

x-novelpia-date-format:
  description: |
    회차 목록 날짜 표기 형식

    | 원문 형식 | 의미 |
    |-----------|------|
    | `YY.MM.DD` | 과거 날짜 (예: `21.01.07` → `2021-01-07`) |
    | `N시간전` | 24시간 이내 게시 (현재 시각 기준 N시간 전) |
    | `N분전` | 24시간 이내 게시 (현재 시각 기준 N분 전) |
    | `N시간후` | 예약 회차 (현재 시각 기준 N시간 후 공개) |
    | `N분후` | 예약 회차 (현재 시각 기준 N분 후 공개) |

    예약 회차는 공개 24시간 전부터 목록에 노출됩니다.
