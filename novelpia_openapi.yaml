  /proc/viewer_data/{ep_code}:
    post:
      tags: [회차]
      summary: 회차 본문 데이터 조회
      description: |
        특정 회차의 본문 텍스트를 JSON으로 반환합니다.

        **`Referer` 헤더 필수**: `https://novelpia.com/viewer/{ep_code}` 형태의
        Referer 없이 요청하면 빈 본문(Content-Length: 0)이 반환됩니다.

        PLUS 회차는 `LOGINKEY` 쿠키(구독 계정) 필요합니다.
        권한 부족 또는 잘못된 번호인 경우 JSON 대신 오류 모달 HTML이 반환됩니다.

        `size` 파라미터는 폰트 크기(pt)로, 실제 본문에는 영향을 주지 않습니다.

        `c` 필드는 AES 암호화된 메타데이터(ct·iv·s 포함)로 추정됩니다.
      operationId: getViewerData
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: 회차 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 3790123
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                size:
                  type: integer
                  default: 14
                  description: 폰트 크기(pt) — 응답 내용에 영향 없음
                  example: 14
      responses:
        "200":
          description: |
            성공 시 회차 본문 JSON, 실패 시 오류 모달 HTML.
            Content-Type이 항상 `text/html`로 올 수 있으므로
            JSON 파싱 성공 여부로 성공/실패를 구분합니다.
          content:
            application/json:
              schema:
                type: object
                required: [s, c]
                properties:
                  s:
                    type: array
                    description: 본문 줄 목록
                    items:
                      $ref: "#/components/schemas/EpisodeTextLine"
                  c:
                    type: string
                    description: |
                      AES 암호화된 메타데이터 JSON 문자열.
                      형식: `{"ct":"...","iv":"...","s":"..."}`
                    example: '{"ct":"abc...","iv":"def...","s":"ghi..."}'
              example:
                s:
                  - text: "마녀가 도시를 지배하기 시작했을 때,"
                  - text: "&nbsp;"
                  - text: "아무도 그것을 막지 않았다."
                c: '{"ct":"abc123","iv":"def456","s":"ghi789"}'
            text/html:
              schema:
                type: string
                description: |
                  오류 시 반환되는 알림 모달 HTML.
                  `#alert_modal` 요소에 오류 메시지가 포함됩니다.

  # ══════════════════════════════════════════════
  # 사용자 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/user:
    post:
      tags: [사용자]
      summary: 사용자 관련 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 다목적 사용자 처리 엔드포인트입니다.

        | mode | 설명 | 인증 필요 |
        |------|------|-----------|
        | `get_member2` | 회원 기본 정보 조회 | 선택적 |
        | `get_member_view` | 회원 공개 프로필 통계 조회 | 선택적 |
        | `get_user_block_chk` | 특정 회원 차단 여부 확인 | 필요 |
        | `get_member_writer_novel` | 작가의 작품 목록 (페이징) | 선택적 |
        | `get_member_badge` | 회원 뱃지 목록 | 선택적 |
        | `get_member_emoticon` | 회원 이모티콘 목록 | 선택적 |
        | `get_member_stamp` | 회원 스탬프 목록 | 선택적 |
        | `get_member_keep_novel` | 회원 보관 소설 목록 | 선택적 |
        | `get_member_donation` | 회원 후원 내역 | 선택적 |
        | `get_episode_cnt` | 회원의 총 회차 열람 수 | 선택적 |
        | `get_stat_hall_of_fame` | 명예의 전당 통계 | 선택적 |
        | `get_member_favorite_novel` | 회원 선호작 목록 | 선택적 |

        모든 모드는 `application/x-www-form-urlencoded` Content-Type을 사용합니다.
        (`get_member_view`는 `multipart/form-data`도 허용됩니다.)
      operationId: procUser
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum:
                    - get_member2
                    - get_member_view
                    - get_user_block_chk
                    - get_member_writer_novel
                    - get_member_badge
                    - get_member_emoticon
                    - get_member_stamp
                    - get_member_keep_novel
                    - get_member_donation
                    - get_episode_cnt
                    - get_stat_hall_of_fame
                    - get_member_favorite_novel
                  description: 처리 모드
                  example: "get_member2"
                mem_no:
                  type: string
                  description: 조회할 회원 번호 (대부분의 모드에서 필수)
                  example: "4169856"
                cate:
                  type: string
                  enum: [emoticon, donation, episode]
                  description: "`get_stat_hall_of_fame` 모드에서 사용하는 카테고리"
                  example: "emoticon"
                "paging[rowCount]":
                  type: string
                  description: "`get_member_writer_novel`, `get_member_favorite_novel` 페이징 — 페이지당 항목 수"
                  example: "5"
                "paging[curPage]":
                  type: string
                  description: 현재 페이지 (1부터 시작)
                  example: "1"
                "paging[order]":
                  type: string
                  description: 정렬 기준 필드
                  example: "date"
                "paging[sort][date]":
                  type: string
                  enum: ["0", "1"]
                  description: |
                    날짜 정렬 방향
                    - `"0"`: 오름차순
                    - `"1"`: 내림차순
                  example: "1"
                "paging[totalPageCnt]":
                  type: string
                  description: 전체 페이지 수 (클라이언트가 이전 응답에서 받은 값 전달)
                  example: "1"
                "paging[rowCountGroup][]":
                  type: string
                  description: 페이지당 항목 수 선택지 (반복 가능)
                  example: "10"
          multipart/form-data:
            schema:
              type: object
              required: [mode, mem_no]
              properties:
                mode:
                  type: string
                  enum: [get_member_view]
                  example: "get_member_view"
                mem_no:
                  type: string
                  description: 조회할 회원 번호
                  example: "300142"
      responses:
        "200":
          description: |
            모드에 따라 다른 JSON 응답을 반환합니다.

            - `get_member2`: `result` 에 회원 기본 정보 객체 포함
            - `get_member_view`: `result` 에 `MemberView` 객체 포함
            - `get_user_block_chk`: `result` 에 `MemberBlockChk` 객체 포함 (차단하지 않은 경우 `result`가 `null` 또는 빈 객체)
            - `get_member_writer_novel`: `result` 에 작가 작품 목록 포함
            - `get_member_badge`: `result` 에 뱃지 목록 포함
            - `get_member_emoticon`: `result` 에 이모티콘 목록 포함
            - `get_member_stamp`: `result` 에 스탬프 목록 포함
            - `get_member_keep_novel`: `result` 에 보관 소설 목록 포함
            - `get_member_donation`: `result` 에 후원 내역 포함
            - `get_episode_cnt`: `result` 에 회차 수 포함
            - `get_stat_hall_of_fame`: `result` 에 명예의 전당 통계 포함
            - `get_member_favorite_novel`: `result` 에 선호작 목록 포함
          content:
            application/json:
              schema:
                oneOf:
                  - description: get_member_view 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            $ref: "#/components/schemas/MemberView"
                  - description: get_user_block_chk 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            oneOf:
                              - $ref: "#/components/schemas/MemberBlockChk"
                              - type: "null"
                                description: 차단하지 않은 경우
                  - description: get_member_writer_novel 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            type: object
                            properties:
                              list:
                                type: array
                                description: 작가의 작품 목록
                                items:
                                  $ref: "#/components/schemas/Novel"
                              paging:
                                type: object
                                description: 페이징 정보
                  - description: get_member_favorite_novel 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            type: object
                            properties:
                              novel:
                                type: array
                                description: 선호작 소설 목록
                                items:
                                  $ref: "#/components/schemas/Novel"
                              allCount:
                                type: integer
                                minimum: 0
                                description: 전체 선호작 수
                                example: 2
                  - description: 기타 모드 공통 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            description: 모드별 결과 데이터
              examples:
                get_user_block_chk:
                  summary: get_user_block_chk 응답 예시
                  value:
                    status: "200"
                    errmsg: ""
                    result:
                      idx: 883261
                      mem_no: 2529720
                      target_mem_no: 4169856
                      regdate: "2026-06-28 02:08:52"
                get_member_view:
                  summary: get_member_view 응답 예시
                  value:
                    status: "200"
                    errmsg: ""
                    result:
                      mem_no: 300142

  /proc/alarm:
    post:
      tags: [사용자]
      summary: 알람 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 알람 관련 엔드포인트입니다.

        | mode | 설명 | 인증 필요 |
        |------|------|-----------|
        | `getAlarmCnt` | 읽지 않은 알람 카운트 조회 | 필요 |
      operationId: procAlarm
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [getAlarmCnt]
                  example: "getAlarmCnt"
      responses:
        "200":
          description: 알람 처리 JSON 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      result:
                        type: object
                        description: "`getAlarmCnt` 모드 응답 결과"
                        properties:
                          cnt:
                            type: integer
                            minimum: 0
                            description: 읽지 않은 알람 수
                            example: 3

  /proc/member_plus:
    get:
      tags: [사용자]
      summary: 멤버 플러스 처리 (다목적)
      description: |
        `cmd` 쿼리 파라미터로 동작을 구분하는 멤버 플러스 관련 엔드포인트입니다.

        | cmd | 설명 |
        |-----|------|
        | `event_list` | 현재 진행 중인 이벤트 목록 조회 |
      operationId: procMemberPlus
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: cmd
          in: query
          required: true
          description: 처리 명령
          schema:
            type: string
            enum: [event_list]
          example: "event_list"
        - name: ignore_list[]
          in: query
          required: false
          description: 무시할 이벤트 ID 목록 (반복 가능)
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          example: [321, 322]
        - name: _
          in: query
          required: false
          description: 캐시 방지용 타임스탬프 (밀리초)
          schema:
            type: integer
          example: 1782828459467
      responses:
        "200":
          description: 이벤트 목록 JSON 또는 HTML 조각
          content:
            application/json:
              schema:
                type: object

  /proc/member_block:
    post:
      tags: [사용자]
      summary: 회원 차단/해제 토글
      description: |
        특정 회원을 차단하거나 차단을 해제합니다.
        이미 차단된 경우 해제, 차단하지 않은 경우 차단됩니다.

        주로 뷰어 페이지 댓글에서 사용합니다.
        CSRF 토큰은 페이지 내 `#csrf` 요소의 `value`를 사용합니다.
      operationId: toggleMemberBlock
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [member_no, csrf]
              properties:
                member_no:
                  type: string
                  description: 차단할 회원 번호
                  example: "12345"
                csrf:
                  type: string
                  description: CSRF 방어 토큰 (`#csrf` 요소의 value)
                  example: "abc123def456"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1||"

  /proc/viewer_board_comment:
    post:
      tags: [사용자]
      summary: 뷰어 게시판 댓글 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 뷰어 게시판 댓글 관련 엔드포인트입니다.

        | mode | 설명 | 인증 필요 |
        |------|------|-----------|
        | `get_user_block` | 로그인 회원의 전체 차단 목록 조회 | 필요 |

        모든 모드는 `application/x-www-form-urlencoded` Content-Type을 사용합니다.
      operationId: procViewerBoardComment
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum:
                    - get_user_block
                  description: 처리 모드
                  example: "get_user_block"
                mem_no:
                  type: string
                  description: "`get_user_block` 모드에서 조회할 회원 번호"
                  example: "453905"
      responses:
        "200":
          description: |
            모드에 따라 다른 JSON 응답을 반환합니다.

            - `get_user_block`: `result.user_block` 에 차단된 회원 번호 문자열 배열 포함
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          user_block:
                            type: array
                            description: 차단된 회원 번호 목록 (문자열)
                            items:
                              type: string
                            example: ["68187", "512785", "175598"]
              examples:
                get_user_block:
                  summary: get_user_block 응답 예시
                  value:
                    status: "200"
                    errmsg: ""
                    result:
                      user_block: ["68187", "512785", "175598", "488213", "161638"]

  /proc/emoticon_openstore:
    get:
      tags: [소설]
      summary: 작가 이모티콘 스토어 정보 조회
      description: |
        특정 소설의 작가가 오픈스토어에 등록한 이모티콘 상품 정보를 반환합니다.
        `mode=getWriterEmoticon` 모드만 확인됐습니다.
      operationId: getWriterEmoticon
      parameters:
        - name: mode
          in: query
          required: true
          description: 조회 모드
          schema:
            type: string
            enum: [getWriterEmoticon]
          example: "getWriterEmoticon"
        - name: novel_no
          in: query
          required: true
          description: 소설 번호
          schema:
            type: integer
            minimum: 1
          example: 23
      responses:
        "200":
          description: 작가 이모티콘 스토어 정보 (JSON)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "응답 상태 코드 (200 = 정상)"
                    example: 200
                  code:
                    type: string
                    description: 오류 코드 (정상 시 빈 문자열)
                    example: ""
                  errmsg:
                    type: string
                    description: 오류 메시지 (정상 시 빈 문자열)
                    example: ""
                  emoticon_group:
                    type: string
                    description: 오픈스토어 이모티콘 그룹 번호 (없으면 빈 문자열)
                    example: "1455"
                  button_show:
                    type: boolean
                    description: 이모티콘 구매 버튼 표시 여부
                    example: true
              example:
                status: 200
                code: ""
                errmsg: ""
                emoticon_group: "1455"
                button_show: true
    post:
      tags: [이모티콘]
      summary: 이미지 URL로 이모티콘/스탬프 그룹 조회
      description: |
        이모티콘 이미지 URL을 전달하면 해당 이미지가 속한 이모티콘 그룹 또는 스탬프 정보를
        반환합니다 (`mode=getImgtoGrpEmt`).

        응답은 `"OK|<JSON>"` 형식의 파이프 구분 문자열입니다.
        JSON 배열 요소는 이모티콘 그룹이면 `emoticon_group_name`/`emoticon_group` 필드를,
        스탬프이면 `stamp_name`/`idx` 필드를 포함합니다.
      operationId: getImgtoGrpEmt
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode, img]
              properties:
                mode:
                  type: string
                  enum: [getImgtoGrpEmt]
                  example: "getImgtoGrpEmt"
                img:
                  type: string
                  description: |
                    이모티콘 이미지의 URL (`<img>` 태그의 `src` 속성값).

                    확인된 예시:
                    - 그룹 1700 (댓글창의 천재 마법사):
                      `https://images.novelpia.com/imagebox/77/776dd92168dde5a663e265c80ef165ce_111886.png`
                    - 그룹 126 (악마? 앙마! 메타짱):
                      `https://image.novelpia.com/img/emoticon/i258rd1u0s/01.png`
                  example: "https://images.novelpia.com/imagebox/77/776dd92168dde5a663e265c80ef165ce_111886.png"
      responses:
        "200":
          description: |
            파이프 구분 응답. 성공 시 `OK|<JSON>`, 실패 시 오류 메시지.

            JSON은 항목 배열이며 각 항목은 다음 두 형태 중 하나입니다:
            - **이모티콘 그룹**: `emoticon_group_name`, `emoticon_group`
            - **스탬프**: `stamp_name`, `idx`
          content:
            text/plain:
              schema:
                type: string
                description: "`OK|<JSON 배열>` 또는 오류 문자열"
              examples:
                emoticon_group_1700:
                  summary: "이모티콘 그룹 1700 — 댓글창의 천재 마법사"
                  value: 'OK|[{"emoticon_group_name":"댓글창의 천재 마법사","emoticon_group":"1700"}]'
                emoticon_group_126:
                  summary: "이모티콘 그룹 126 — 악마? 앙마! 메타짱"
                  value: 'OK|[{"emoticon_group_name":"악마? 앙마! 메타짱","emoticon_group":"126"}]'
                stamp:
                  summary: 스탬프 결과 (참고용)
                  value: 'OK|[{"stamp_name":"응원 스탬프","idx":"42"}]'
                error:
                  summary: 오류
                  value: "해당 이모티콘을 찾을 수 없습니다."

  /proc/emoticon_proc:
    get:
      tags: [이모티콘]
      summary: 사용자 이모티콘 조회 (그룹 목록 / 그룹 내 이모티콘)
      description: |
        댓글 작성 UI에서 사용하는 사용자 이모티콘 조회 엔드포인트입니다.
        `mode` 값에 따라 두 가지 조회를 수행합니다.

        - `mode=get_user_emoticon_group`: 보유 이모티콘 **그룹** 목록.
          인증 쿠키(LOGINKEY) 없이도 HTTP `status:200`을 반환하지만 `data`는 빈 배열입니다.
          선택적 `target=sort` 파라미터를 추가하면 노벨티콘 순서/표시 관리 화면용 변형 응답이 되며,
          각 항목에 표시 여부 플래그 `is_hide`(1=숨김, 0=노출)가 포함됩니다.
        - `mode=get_user_emoticon`: 특정 그룹(`emoticon_group_no`) 내 보유 이모티콘 목록.
          비로그인 시 `status:401`("로그인이 필요합니다.")을 반환합니다.
          `data`가 **두 형태로 다형적(polymorphic)**입니다 — 보통은 이모티콘 객체의 배열이지만,
          한정 노벨티콘 무료 사용 기간이 만료된 경우 `is_buy_emoticon` 필드를 가진 단일 객체가 옵니다.

        주의: 두 모드 모두 HTTP 상태는 항상 200이며, 실제 결과/오류는 본문의 `status` 필드로 구분합니다.

        ⚠️ 개인정보: `get_user_emoticon_group` 응답의 각 항목은 클라이언트 UI가 실제로 사용하지 않는
        필드(`novel_owner`, `mem_no`, `emoticon_memo`, `coin`, `regdate` 등)까지 과다 전송합니다.
        특히 `novel_owner`는 이메일 가입 작가의 **원본 이메일 주소를 평문으로 노출**합니다
        (확인된 클라이언트 스크립트는 `emoticon_group`·`emoticon_url`만 사용).
      operationId: getUserEmoticon
      parameters:
        - name: mode
          in: query
          required: true
          description: 조회 모드
          schema:
            type: string
            enum: [get_user_emoticon_group, get_user_emoticon]
          example: "get_user_emoticon_group"
        - name: emoticon_group_no
          in: query
          required: false
          description: "이모티콘 그룹 번호 (`mode=get_user_emoticon`일 때 필수)"
          schema:
            type: integer
            minimum: 1
          example: 174
        - name: target
          in: query
          required: false
          description: |
            `mode=get_user_emoticon_group`일 때만 사용. `sort`로 지정하면
            노벨티콘 순서/표시 관리 화면용 응답이 되며 각 항목에 `is_hide` 플래그가 포함됩니다.
          schema:
            type: string
            enum: [sort]
          example: "sort"
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 사용자 보유 이모티콘 그룹 목록 (JSON)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "응답 상태 코드 (200 = 정상)"
                    example: 200
                  code:
                    type: string
                    description: 오류 코드 (정상 시 빈 문자열)
                    example: ""
                  errmsg:
                    type: ["string", "null"]
                    description: 오류 메시지 (정상 시 null)
                    example: null
                  data:
                    type: array
                    description: 보유 이모티콘 그룹 목록
                    items:
                      type: object
                      properties:
                        idx:
                          type: integer
                          description: 이모티콘 항목 고유 번호
                          example: 12260
                        state:
                          type: integer
                          description: |
                            이모티콘 상태.
                            0=무료, 1=구매 가능, 2=작품 연계 구매, 3=기간 한정(만료), 4=멤버십 전용, 8=노벨피아 공식
                          example: 2
                        mem_no:
                          type: integer
                          description: |
                            작가 회원 번호 (노벨피아 공식 이모티콘은 0).
                            ⚠️ 회원 번호 열거(enumeration)가 가능한 식별자이며 UI에서 사용되지 않습니다.
                          example: 3763940
                        novel_owner:
                          type: string
                          description: |
                            작가 계정 식별자. 소셜 로그인은 `gg:`(Google)·`nv:`(Naver) 접두사 식별자로,
                            공식 이모티콘은 "노벨피아"로 표기됩니다.
                            ⚠️ **개인정보 노출**: 이메일 가입 작가의 경우 원본 이메일 주소가 평문으로 노출됩니다
                            (예: `zzz00713@naver.com`). UI에서 사용되지 않는 필드입니다.
                          example: "gg:110185598566906369508"
                        novel_no:
                          type: integer
                          description: 연계 소설 번호 (공식 이모티콘은 0)
                          example: 370230
                        emoticon_group:
                          type: integer
                          description: 이모티콘 그룹 번호
                          example: 1700
                        emoticon_group_name:
                          type: string
                          description: 이모티콘 그룹 이름
                          example: "댓글창의 천재 마법사"
                        emoticon_name:
                          type: ["string", "null"]
                          description: 개별 이모티콘 이름 (그룹 단위 조회 시 null)
                          example: null
                        emoticon_url:
                          type: string
                          description: 대표 이모티콘 이미지 URL (프로토콜 상대 경로)
                          example: "//images.novelpia.com/imagebox/77/776dd92168dde5a663e265c80ef165ce_111886.png"
                        emoticon_memo:
                          type: ["string", "null"]
                          description: 이모티콘 설명 문구 (없으면 null)
                          example: "댓천마 이모티콘이 출시되었습니다."
                        coin:
                          type: integer
                          description: 구매 가격 (코인). 0=무료
                          example: 30
                        novel_url:
                          type: ["string", "null"]
                          description: 연계 소설 URL (미사용, 항상 null)
                          example: null
                        hit:
                          type: integer
                          description: 조회 수 (현재 항상 0)
                          example: 0
                        mileage:
                          type: ["integer", "null"]
                          description: 마일리지 가격 (기간 한정 이모티콘의 경우 1000, 일반은 null)
                          example: null
                        use_date:
                          type: integer
                          description: 사용 기간 제한 여부 (0=무제한, 1=기간 한정)
                          example: 0
                        startdate:
                          type: ["string", "null"]
                          description: 사용 시작 일시 (기간 한정 이모티콘, ISO 8601 없는 로컬시간)
                          example: null
                        enddate:
                          type: ["string", "null"]
                          description: 사용 종료 일시 (기간 한정 이모티콘)
                          example: null
                        opendate:
                          type: ["string", "null"]
                          description: 공개 시작 일시
                          example: null
                        regdate:
                          type: string
                          description: 등록 일시 (YYYY-MM-DD HH:mm:ss)
                          example: "2026-01-28 14:49:35"
                        is_trial:
                          type: ["integer", "null"]
                          description: 트라이얼 여부
                          example: null
                        trial_start_dt:
                          type: ["string", "null"]
                          description: 트라이얼 시작 일시
                          example: null
                        trial_end_dt:
                          type: ["string", "null"]
                          description: 트라이얼 종료 일시
                          example: null
                        is_emoticon:
                          type: ["integer", "null"]
                          description: 이모티콘 여부 플래그 (1=이모티콘, null=스탬프 등 다른 유형)
                          example: 1
                        flag_trial:
                          type: ["integer", "null"]
                          description: 트라이얼 플래그
                          example: null
                        trial_member_start_dt:
                          type: ["string", "null"]
                          description: 멤버십 트라이얼 시작 일시
                          example: null
                        trial_member_end_dt:
                          type: ["string", "null"]
                          description: 멤버십 트라이얼 종료 일시
                          example: null
                        is_hide:
                          type: integer
                          description: |
                            그룹 숨김 여부 (1=댓글 UI에서 숨김, 0=노출).
                            `target=sort` 변형 응답에서만 포함됩니다.
                          example: 0
              example:
                status: 200
                code: ""
                errmsg: null
                data:
                  - idx: 12260
                    state: 2
                    mem_no: 3763940
                    novel_owner: "gg:110185598566906369508"
                    novel_no: 370230
                    emoticon_group: 1700
                    emoticon_group_name: "댓글창의 천재 마법사"
                    emoticon_name: null
                    emoticon_url: "//images.novelpia.com/imagebox/77/776dd92168dde5a663e265c80ef165ce_111886.png"
                    emoticon_memo: "댓천마 이모티콘이 출시되었습니다."
                    coin: 30
                    novel_url: null
                    hit: 0
                    mileage: null
                    use_date: 0
                    startdate: null
                    enddate: null
                    opendate: null
                    regdate: "2026-01-28 14:49:35"
                    is_trial: null
                    trial_start_dt: null
                    trial_end_dt: null
                    is_emoticon: 1
                    flag_trial: null
                    trial_member_start_dt: null
                    trial_member_end_dt: null
                  - idx: 7765
                    state: 3
                    mem_no: 0
                    novel_owner: "노벨피아"
                    novel_no: 0
                    emoticon_group: 126
                    emoticon_group_name: "악마? 앙마! 메타짱"
                    emoticon_name: null
                    emoticon_url: "//image.novelpia.com/img/emoticon/i258rd1u0s/01.png"
                    emoticon_memo: null
                    coin: 10
                    novel_url: null
                    hit: 0
                    mileage: 1000
                    use_date: 1
                    startdate: "2023-07-11 15:00:00"
                    enddate: "2023-07-31 15:00:00"
                    opendate: "2023-07-11 15:00:00"
                    regdate: "2023-07-07 15:06:06"
                    is_trial: null
                    trial_start_dt: null
                    trial_end_dt: null
                    is_emoticon: 1
                    flag_trial: null
                    trial_member_start_dt: null
                    trial_member_end_dt: null
          # mode=get_user_emoticon 응답 형태(다형적):
          #
          # (1) 일반 — 그룹 내 보유 이모티콘 배열:
          #   {"status":200,"code":"","errmsg":null,
          #    "data":[{"idx":12068,"is_use":1,"is_fav":0,"state":8,
          #             "emoticon_url":"//images.novelpia.com/img/emoticon/174/12068.png"}, ...]}
          #
          # (2) 한정 노벨티콘 무료 사용 기간 만료 — is_buy_emoticon 필드를 가진 단일 객체:
          #   {"status":200,"code":"","errmsg":null,
          #    "data":{"is_buy_emoticon":1,"emoticon_group":174,
          #            "emoticon_group_name":"...","emoticon_url":"..."}}
          #   (is_buy_emoticon=1 → "구매하기" 버튼, 그 외 → "다른 이모티콘 보기")
          #
          # mode=get_user_emoticon 을 비로그인으로 호출하면 HTTP 200이지만
          # 본문 status는 401이 됩니다:
          #   {"status":401,"code":"","errmsg":"로그인이 필요합니다."}
          #
          # 그룹 내 이모티콘 항목 스키마는 #/components/schemas/UserEmoticonItem 참조.

  # ══════════════════════════════════════════════
  # 소설 목록 페이지
  # ══════════════════════════════════════════════

  /:
    get:
      tags: [소설 목록]
      summary: 홈 페이지
      description: 노벨피아 메인 홈 페이지. 추천 소설·이벤트·랭킹 등이 표시됩니다.
      operationId: getHome
      responses:
        "200":
          description: 홈 HTML 페이지
          content:
            text/html:
              schema:
                type: string

  /freestory:
    get:
      tags: [소설 목록]
      summary: 자유 연재 목록 메인
      description: |
        자유 연재(무료) 소설 목록 메인 페이지입니다.
