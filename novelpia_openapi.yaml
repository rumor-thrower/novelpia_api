  # ══════════════════════════════════════════════
  # 소설 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/main:
    post:
      tags: [소설]
      summary: 메인 페이지 데이터 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 다목적 메인 페이지 처리 엔드포인트입니다.

        | mode | 설명 |
        |------|------|
        | `getNewHotList` | 새로운 인기 목록 조회 |

        응답은 인기 소설 목록을 반환합니다 (`result` 필드에 배열 형식).
      operationId: procMain
      requestBody:
        $ref: "#/components/requestBodies/GetNewHotListBody"
      responses:
        "200":
          description: 인기 목록 JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      result:
                        type: array
                        description: 인기 소설 목록
                        items:
                          $ref: "#/components/schemas/Novel"
              example:
                status: "200"
                errmsg: ""
                result:
                  - novel_genre:
                      - "판타지"
                      - "중세"
                      - "하렘"
                      - "먼치킨"
                    novel_thumb: "//images.novelpia.com/imagebox/cover/11576a6b7d10e5a37598da89dfa7b3b6_369320_ori.wimg"
                    novel_age: "0"
                    novel_name: "다크 판타지에서도 쌀은 먹고 살아야지?"
                    novel_no: "372669"
                    mem_nick: "미츄리"
                    rank_view: "97810"
                    rank_exp: null
                    main_genre: "1"

  /proc/novel:
    post:
      tags: [소설]
      summary: 소설 관련 처리 (다목적)
      description: |
        `cmd` 파라미터로 동작을 구분하는 다목적 소설 처리 엔드포인트입니다.

        | cmd | 설명 |
        |-----|------|
        | `get_episode_count_view` | 회차 조회수 일괄 조회 (신버전) |
        | `get_episode_cnt_view` | 회차 조회수 일괄 조회 (구버전) |

        두 cmd 값은 동일한 기능이며 파라미터 명만 다릅니다.
      operationId: procNovel
      requestBody:
        $ref: "#/components/requestBodies/GetEpisodeCountViewBody"
      responses:
        "200":
          description: 회차 조회수 JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: "#/components/schemas/EpisodeViewCount"
              example:
                status: 200
                errmsg: ""
                list:
                  - episode_no: 7146
                    count_view: "1,057"
                  - episode_no: 7147
                    count_view: "842"

  /proc/novel_alarm:
    post:
      tags: [소설]
      summary: 소설 알람 설정/해제 토글
      description: |
        특정 소설의 새 회차 알람을 설정하거나 해제합니다.
        이미 설정된 상태이면 해제, 해제된 상태이면 설정됩니다.

        비로그인 시 `login|0||` 응답이 반환됩니다.
      operationId: toggleNovelAlarm
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1896||0"

  /proc/novel_like:
    post:
      tags: [소설]
      summary: 소설 선호작 설정/해제 토글
      description: |
        특정 소설을 선호작으로 등록하거나 해제합니다.
        CSRF 토큰이 필요합니다 (소설 페이지의 `alarm_btn` JS 함수 내 `"csrf"` 값).

        비로그인 시 `login|0||` 응답이 반환됩니다.

        **주의**: 실 서버 테스트 결과, 성공 시 응답 본문이 빈 문자열(`Content-Length: 0`)로
        반환되는 경우가 관찰됩니다. 파이프 응답 형식과 다를 수 있으며, HTTP 200 여부로 성공을 판단하세요.
      operationId: toggleNovelLike
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no, csrf_token]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
                csrf_token:
                  type: string
                  description: CSRF 방어 토큰
                  example: "abc123def456"
      responses:
        "200":
          description: |
            성공 시 빈 본문(`Content-Length: 0`) 또는 파이프 구분 응답.
            비로그인 시 `login|0||` 반환.
          content:
            text/plain:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PipeDelimitedResponse"
                  - type: string
                    maxLength: 0
                    description: 성공 시 빈 문자열
              example: ""

  /proc/board_option:
    post:
      tags: [소설]
      summary: 게시판 옵션 처리 (회차 추천/비추천)
      description: |
        `option` 파라미터에 따라 게시판 옵션을 처리합니다.

        | option | 설명 |
        |--------|------|
        | `vote_novel` | 회차 추천/비추천 토글 |

        CSRF 토큰이 필요합니다.
        응답이 `on`으로 시작하면 추천 등록, `off`로 시작하면 추천 해제입니다.
      operationId: procBoardOption
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [option, value, csrf]
              properties:
                option:
                  type: string
                  enum: [vote_novel]
                  description: 처리 옵션 종류
                  example: "vote_novel"
                value:
                  type: string
                  description: 대상 회차 번호 (`ep_code`)
                  example: "3790123"
                csrf:
                  type: string
                  description: CSRF 방어 토큰
                  example: "abc123def456"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1||"

  # ══════════════════════════════════════════════
  # 회차 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/episode_list:
    post:
      tags: [회차]
      summary: 회차 목록 조회
      description: |
        소설의 회차 목록 HTML 조각을 반환합니다.
        한 페이지당 20개 회차가 포함됩니다.

        - `sort`: 정렬 방향 (`DOWN` = 첫화부터, `UP` = 최신화부터)
        - `page`: 0부터 시작 (1페이지 → `0`, 2페이지 → `1`, ...)
        - 로그인 쿠키 포함 시 PLUS 회차 링크도 포함됩니다.

        응답은 전체 HTML이 아닌 `<table>` 조각입니다.
        소설 번호는 회차 목록 내 `.page-link` 태그의 `onclick` 속성에서 추출합니다.
      operationId: getEpisodeList
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [novel_no]
              properties:
                novel_no:
                  type: string
                  description: 소설 번호
                  example: "23"
                sort:
                  type: string
                  enum: [DOWN, UP]
                  default: DOWN
                  description: |
                    정렬 방향
                    - `DOWN`: 첫화부터 (오름차순)
                    - `UP`: 최신화부터 (내림차순)
                  example: "DOWN"
                page:
                  type: integer
                  minimum: 0
                  default: 0
                  description: 페이지 번호 (0부터 시작)
                  example: 0
      responses:
        "200":
          description: 회차 목록 HTML 조각
          content:
            text/html:
              schema:
                type: string
              example: |
                <table class="s_inv">
                  <tbody>
                    <tr class="ep_style5" data-episode-no="7146">
                      <td class="font12" onclick="$('.loads').show();location='/viewer/7146';">
                        <b>
                          <span class="b_free s_inv">무료</span>
                          <i class="icon ion-bookmark" id="bookmark_7146" style="display:none;"></i>
                          001. 능력 각성
                        </b>
                      </td>
                    </tr>
                  </tbody>
                </table>

  /proc/novel_comment/{novel_no}:
    get:
      tags: [회차]
      summary: 소설 댓글 목록 조회 (HTML)
      description: |
        특정 소설의 댓글 목록을 페이지 단위로 조회합니다.

        페이지네이션은 `page` 쿼리 파라미터로 제어됩니다 (1부터 시작).
        한 페이지당 댓글 수는 서버 기본값을 따릅니다.

        **응답 형식**: HTML 조각 (JSON이 아님)
        - 헤더: `.comment_header` 요소 (정렬 옵션 포함)
        - 댓글 항목: `.row._comment_flag` (각 댓글은 `id="comment_{comment_id}"`)
        - 댓글 작성자: `<b onclick="location='/user/{mem_no}';">` 형식
        - 댓글 내용: `#comment_text_{comment_id}` div
        - 추천/비추: `#comment_vote_{comment_id}`, `#comment_bad_vote_{comment_id}`
        - 신고: `#comment_report_{comment_id}`

        비로그인 상태에서도 공개 댓글 조회 가능합니다.
      operationId: getNovelComments
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: novel_no
          in: path
          required: true
          description: 소설 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 35
        - name: page
          in: query
          required: false
          description: 페이지 번호 (1부터 시작)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        "200":
          description: 소설 댓글 목록 HTML 조각
          content:
            text/html:
              schema:
                type: string
              example: |
                <style>...</style>
                <script>...</script>
                <div style="display: flex; ..." class="comment_header">
                    <div class="eplist-sub-title">
                        <span> 소설 전체 댓글 </span>
                    </div>
                    <div>
                        <span class="reply_all_toggle active">
                            <i class="icon ion-ios-arrow-up"></i> 대댓글
                        </span>
                    </div>
                </div>
                <div class="row _comment_flag" id="comment_32514455">
                    <div class="col-12 pd-b-10">
                        <table class="c_s2" align="right">
                            <tr>
                                <td colspan="2" class="c_s1">
                                    <b onclick="location='/user/264483';">Mulael</b>
                                </td>
                                <td valign="top" rowspan="1">
                                    <img src="/img/layout/none_user.png" class="rounded-circle" style="width:32px; height: 32px;">
                                </td>
                            </tr>
                            <tr>
                                <td valign="top" class="c_s3" colspan="3">
                                    <font style="color:#666;font-size:11px;">24.09.22 작성됨 </font>
                                    <br>
                                    <a href="/viewer/337"><span style="color:#666;font-size:11px;">댓글 회차 : 0. 필드의 마법사</span></a>
                                    <br>
                                    <div id="comment_text_32514455"></div>
                                </td>
                            </tr>
                            <tr>
                                <td valign="top" style="text-align:right;" colspan="4">
                                    <font style="color:#b214bc;font-size:11px;" id="comment_vote_32514455">
                                        <i class="ion-thumbsup"></i> 추천 (0건)
                                    </font>
                                    <font style="color:#bc143b;font-size:11px;" id="comment_bad_vote_32514455">
                                        <i class="ion-thumbsdown"></i> 비추 (0건)
                                    </font>
                                    <font id="comment_report_32514455" onclick="option_proc('comment_report', '32514455');">
                                        <i class="ion-thumbsdown"></i> 신고
                                    </font>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

  /proc/viewer_data/{ep_code}:
    post:
      tags: [회차]
      summary: 회차 본문 데이터 조회
      description: |
        특정 회차의 본문 텍스트를 JSON으로 반환합니다.

        **`Referer` 헤더 필수**: `https://novelpia.com/viewer/{ep_code}` 형태의
        Referer 없이 요청하면 빈 본문(Content-Length: 0)이 반환됩니다.

        PLUS 회차는 `LOGINKEY` 쿠키(구독 계정) 필요합니다.
        권한 부족 또는 잘못된 번호인 경우 JSON 대신 오류 모달 HTML이 반환됩니다.

        `size` 파라미터는 폰트 크기(pt)로, 실제 본문에는 영향을 주지 않습니다.

        `c` 필드는 AES 암호화된 메타데이터(ct·iv·s 포함)로 추정됩니다.
      operationId: getViewerData
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: 회차 고유 번호
          schema:
            type: integer
            minimum: 1
          example: 3790123
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                size:
                  type: integer
                  default: 14
                  description: 폰트 크기(pt) — 응답 내용에 영향 없음
                  example: 14
      responses:
        "200":
          description: |
            성공 시 회차 본문 JSON, 실패 시 오류 모달 HTML.
            Content-Type이 항상 `text/html`로 올 수 있으므로
            JSON 파싱 성공 여부로 성공/실패를 구분합니다.
          content:
            application/json:
              schema:
                type: object
                required: [s, c]
                properties:
                  s:
                    type: array
                    description: 본문 줄 목록
                    items:
                      $ref: "#/components/schemas/EpisodeTextLine"
                  c:
                    type: string
                    description: |
                      AES 암호화된 메타데이터 JSON 문자열.
                      형식: `{"ct":"...","iv":"...","s":"..."}`
                    example: '{"ct":"abc...","iv":"def...","s":"ghi..."}'
              example:
                s:
                  - text: "마녀가 도시를 지배하기 시작했을 때,"
                  - text: "&nbsp;"
                  - text: "아무도 그것을 막지 않았다."
                c: '{"ct":"abc123","iv":"def456","s":"ghi789"}'
            text/html:
              schema:
                type: string
                description: |
                  오류 시 반환되는 알림 모달 HTML.
                  `#alert_modal` 요소에 오류 메시지가 포함됩니다.

  # ══════════════════════════════════════════════
  # 사용자 관련 proc 엔드포인트
  # ══════════════════════════════════════════════

  /proc/user:
    post:
      tags: [사용자]
      summary: 사용자 관련 처리 (다목적)
      description: |
        `mode` 파라미터로 동작을 구분하는 다목적 사용자 처리 엔드포인트입니다.

        | mode | 설명 | Content-Type | 인증 필요 |
        |------|------|--------------|-----------|
        | `get_member_view` | 회원 공개 프로필 통계 조회 | `multipart/form-data` | 필요 |
        | `get_member_favorite_novel` | 회원 선호작 목록 조회 | `application/x-www-form-urlencoded` | 선택적 |
      operationId: procUser
      security:
        - loginKeyCookie: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - description: get_member_view — 회원 공개 프로필 통계 조회
                  type: object
                  required: [mode, mem_no]
                  properties:
                    mode:
                      type: string
                      enum: [get_member_view]
                      example: "get_member_view"
                    mem_no:
                      type: string
                      description: 조회할 회원 번호
                      example: "300142"
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - description: get_member_favorite_novel — 회원 선호작 목록 조회
                  type: object
                  required: [mode, mem_no]
                  properties:
                    mode:
                      type: string
                      enum: [get_member_favorite_novel]
                      example: "get_member_favorite_novel"
                    mem_no:
                      type: string
                      description: 조회할 회원 번호
                      example: "12345"
                    "paging[rowCount]":
                      type: string
                      description: 한 번에 가져올 최대 항목 수
                      default: "1000"
                      example: "1000"
                    "paging[curPage]":
                      type: string
                      description: 현재 페이지 (1부터 시작)
                      default: "1"
                      example: "1"
                    "paging[order]":
                      type: string
                      description: 정렬 기준 필드
                      example: "date"
                    "paging[sort][date]":
                      type: string
                      enum: ["0", "1"]
                      description: |
                        날짜 정렬 방향
                        - `"0"`: 오름차순
                        - `"1"`: 내림차순
                      example: "1"
      responses:
        "200":
          description: |
            모드에 따라 다른 JSON 응답을 반환합니다.

            - `get_member_view`: `result` 에 `MemberView` 객체 포함
            - `get_member_favorite_novel`: `result` 에 선호작 목록 포함
          content:
            application/json:
              schema:
                oneOf:
                  - description: get_member_view 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            $ref: "#/components/schemas/MemberView"
                  - description: get_member_favorite_novel 응답
                    allOf:
                      - $ref: "#/components/schemas/BaseResponse"
                      - type: object
                        properties:
                          result:
                            type: object
                            properties:
                              novel:
                                type: array
                                description: 선호작 소설 목록
                                items:
                                  $ref: "#/components/schemas/Novel"
                              allCount:
                                type: integer
                                minimum: 0
                                description: 전체 선호작 수
                                example: 2
              example:
                status: "200"
                errmsg: ""
                result:
                  mem_no: 300142

  /proc/member_block:
    post:
      tags: [사용자]
      summary: 회원 차단/해제 토글
      description: |
        특정 회원을 차단하거나 차단을 해제합니다.
        이미 차단된 경우 해제, 차단하지 않은 경우 차단됩니다.

        주로 뷰어 페이지 댓글에서 사용합니다.
        CSRF 토큰은 페이지 내 `#csrf` 요소의 `value`를 사용합니다.
      operationId: toggleMemberBlock
      security:
        - loginKeyCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [member_no, csrf]
              properties:
                member_no:
                  type: string
                  description: 차단할 회원 번호
                  example: "12345"
                csrf:
                  type: string
                  description: CSRF 방어 토큰 (`#csrf` 요소의 value)
                  example: "abc123def456"
      responses:
        "200":
          description: 파이프 구분 응답
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PipeDelimitedResponse"
              example: "on|1||"

  /proc/emoticon_openstore:
    get:
      tags: [소설]
      summary: 작가 이모티콘 스토어 정보 조회
      description: |
        특정 소설의 작가가 오픈스토어에 등록한 이모티콘 상품 정보를 반환합니다.
        `mode=getWriterEmoticon` 모드만 확인됐습니다.
      operationId: getWriterEmoticon
      parameters:
        - name: mode
          in: query
          required: true
          description: 조회 모드
          schema:
            type: string
            enum: [getWriterEmoticon]
          example: "getWriterEmoticon"
        - name: novel_no
          in: query
          required: true
          description: 소설 번호
          schema:
            type: integer
            minimum: 1
          example: 23
      responses:
        "200":
          description: 작가 이모티콘 스토어 정보 (JSON)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "응답 상태 코드 (200 = 정상)"
                    example: 200
                  emoticon_list:
                    type: array
                    description: 이모티콘 상품 목록 (없으면 빈 배열)
                    items:
                      type: object
                      properties:
                        item_id:
                          type: integer
                          description: 오픈스토어 상품 번호
                        item_name:
                          type: string
                          description: 이모티콘 상품명

