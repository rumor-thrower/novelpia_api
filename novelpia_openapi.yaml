  /freestory/{status}/{sort}/{page}/{genre_filter}:
    get:
      tags: [소설 목록]
      summary: 자유 연재 목록 (필터링)
      description: |
        자유 연재 소설 목록을 상태·정렬·페이지·장르로 필터링합니다.

        **URL 구조**: `/freestory/{status}/{sort}/{page}/{genre_filter}?main_genre={id}`

        | 파라미터 | 예시 값 |
        |----------|---------|
        | status | `all` · `new` · `complete` |
        | sort | `date` · `view` · `vote` |
        | page | 1, 2, 3, ... |
        | genre_filter | `all` · `판타지` · `무협` · `현대` · `로맨스` · `SF` 등 (선택) |
        | main_genre | 0~14 (장르 번호, 없으면 전체) |
      operationId: getFreestoryList
      parameters:
        - name: status
          in: path
          required: true
          description: |
            소설 연재 상태 필터
            - `all`: 전체
            - `new`: 신작
            - `complete`: 완결작
          schema:
            type: string
            enum: [all, new, complete]
          example: "all"
        - name: sort
          in: path
          required: true
          description: |
            정렬 기준
            - `date`: 최신순
            - `view`: 조회순
            - `vote`: 추천순
          schema:
            type: string
            enum: [date, view, vote]
          example: "date"
        - name: page
          in: path
          required: true
          description: 페이지 번호 (1부터 시작)
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: genre_filter
          in: path
          required: true
          description: "장르 슬러그 — URL 인코딩된 한국어(`판타지` 등) 또는 `all`(전체)"
          schema:
            type: string
          example: "all"
        - name: main_genre
          in: query
          required: false
          description: |
            장르 번호 필터 (없으면 전체)
            - 1: 판타지, 2: 무협, 3: 현대, 6: 로맨스, 7: 대체역사
            - 8: 스포츠, 9: SF, 10: 기타, 11: 패러디
            - 12: 현대 판타지, 13: 라이트노벨, 14: 공포
          schema:
            type: integer
            minimum: 0
            maximum: 14
      responses:
        "200":
          description: 자유 연재 목록 HTML
          content:
            text/html:
              schema:
                type: string

